[project]
name = "classerr"
version = "0.1.0"
description = "AppMax method for classification models"
readme = "README.md"
authors = [
    { name = "Vít Kološ", email = "vit.kolos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "gurobipy>=13.0.3",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "scipy-stubs>=1.18.1.1",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132" },
]
torchvision = [
    { index = "pytorch-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "torchvision.*,sklearn.*,joblib.*"
ignore_missing_imports = true
